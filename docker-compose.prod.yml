version: "3.9"

# ═══════════════════════════════════════════════════════════════════
# EcoVision AI — Production Docker Compose
# Services: postgres · redis · chromadb · backend · celery · nginx
# Run:  docker compose -f docker-compose.prod.yml up -d
# ═══════════════════════════════════════════════════════════════════

x-common-env: &common-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  SECRET_KEY: ${SECRET_KEY}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-mistralai/mistral-7b-instruct}
  WATSONX_API_KEY: ${WATSONX_API_KEY:-}
  WATSONX_PROJECT_ID: ${WATSONX_PROJECT_ID}
  CHROMA_HOST: chromadb
  CHROMA_PORT: "8000"
  ENVIRONMENT: production
  SENTRY_DSN: ${SENTRY_DSN}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}

services:

  # ── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: eco_postgres
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-ecovision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-ecovision}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecovision}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 512M }

  # ── Redis ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: eco_redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { memory: 320M }

  # ── ChromaDB ──────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: eco_chroma
    restart: always
    environment:
      ANONYMIZED_TELEMETRY: "false"
      ALLOW_RESET: "false"
      CHROMA_SERVER_AUTH_CREDENTIALS: ${CHROMA_AUTH_TOKEN}
      CHROMA_SERVER_AUTH_PROVIDER: chromadb.auth.token.TokenAuthServerProvider
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: eco_backend
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      chromadb: { condition: service_healthy }
    environment:
      <<: *common-env
    volumes:
      - upload_data:/app/uploads
      - report_data:/app/reports
    command: >
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      -w 4
      --bind 0.0.0.0:8000
      --timeout 120
      --graceful-timeout 30
      --keep-alive 5
      --access-logfile -
      --error-logfile -
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1" }

  # ── Celery Worker ──────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: eco_celery
    restart: always
    depends_on:
      backend: { condition: service_healthy }
    environment:
      <<: *common-env
    volumes:
      - upload_data:/app/uploads
      - report_data:/app/reports
    command: >
      celery -A celery_worker worker
      --loglevel=info
      --concurrency=2
      --max-tasks-per-child=100
      -Q default,reports,indexing
    deploy:
      resources:
        limits: { memory: 2G, cpus: "1" }

  # ── Celery Beat (scheduled tasks) ─────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: eco_beat
    restart: always
    depends_on: [celery_worker]
    environment:
      <<: *common-env
    command: celery -A celery_worker beat --loglevel=info --scheduler celery.beat:PersistentScheduler

  # ── Celery Flower (monitoring) ─────────────────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: eco_flower
    restart: unless-stopped
    depends_on: [celery_worker]
    environment:
      <<: *common-env
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-admin}:${FLOWER_PASSWORD}
    command: celery -A celery_worker flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD}
    ports: ["5555:5555"]

  # ── Nginx (SSL + reverse proxy + static) ──────────────────────
  nginx:
    image: nginx:alpine
    container_name: eco_nginx
    restart: always
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx
      - ssl_certs:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  upload_data:
  report_data:
  nginx_logs:
  ssl_certs:
