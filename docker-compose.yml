version: "3.9"
# Local development stack
services:
  postgres:
    image: postgres:16-alpine
    container_name: eco_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecovision
      POSTGRES_PASSWORD: ecovision_dev
      POSTGRES_DB: ecovision
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ecovision"]
      interval: 10s; timeout: 5s; retries: 5

  redis:
    image: redis:7-alpine
    container_name: eco_dev_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s; timeout: 3s; retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: eco_dev_chroma
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: "false"
      ALLOW_RESET: "true"
    ports: ["8001:8000"]
    volumes: [chroma_data:/chroma/chroma]
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8000/api/v1/heartbeat"]
      interval: 15s; timeout: 5s; retries: 5

volumes:
  postgres_data:
  redis_data:
  chroma_data:
