###############################################################################
# EcoVision AI — Render Blueprint (render.yaml)
# Docs: https://render.com/docs/blueprint-spec
#
# HOSTING ARCHITECTURE:
#   - Backend API: Render Web Service (Native Python runtime)
#   - Background Tasks: Render Worker Service (Native Python runtime)
#   - Cache / Task Broker: Upstash Redis (https://upstash.com)
#   - Database: Supabase PostgreSQL (https://supabase.com)
#   - Frontend: Vercel Static Web App (https://vercel.com)
###############################################################################

services:
  # ---------------------------------------------------------------------------
  # 1. Backend — FastAPI / Uvicorn Web Service (Native Python)
  # ---------------------------------------------------------------------------
  - type: web
    name: ecovision-backend
    runtime: python
    buildCommand: bash scripts/render-build.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: REPORTS_DIR
        value: /tmp/reports
      - key: ALLOWED_ORIGINS
        value: https://ecovision-frontend.vercel.app
      - key: OPENROUTER_MODEL
        value: openrouter/free
      # ── Set these in Render Dashboard (Environment Tab):
      # DATABASE_URL = postgresql://postgres:[PASSWORD]@db.anmnftryknkbxinetxff.supabase.co:5432/postgres
      # REDIS_URL    = redis://default:[PASSWORD]@shining-mink-141794.upstash.io:6379

  # ---------------------------------------------------------------------------
  # 2. Celery Worker — Async Task Processor (Native Python)
  # ---------------------------------------------------------------------------
  - type: worker
    name: ecovision-celery
    runtime: python
    buildCommand: pip install --no-cache-dir -r backend/requirements.txt
    startCommand: cd backend && celery -A app.core.celery_app worker --loglevel=info
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: REPORTS_DIR
        value: /tmp/reports
      - key: OPENROUTER_MODEL
        value: openrouter/free
      # ── Set these in Render Dashboard (Environment Tab):
      # DATABASE_URL = postgresql://postgres:[PASSWORD]@db.anmnftryknkbxinetxff.supabase.co:5432/postgres
      # REDIS_URL    = redis://default:[PASSWORD]@shining-mink-141794.upstash.io:6379

# NOTE: Frontend is hosted separately on Vercel.
# Connect your repository to Vercel and deploy the frontend directory directly.
