###############################################################################
# EcoVision AI — Render Blueprint (render.yaml)
# Docs: https://render.com/docs/blueprint-spec
#
# HOSTING ARCHITECTURE:
#   - Backend API: Render Web Service (Native Python runtime)
#   - Background Tasks: Render Worker Service (Native Python runtime)
#   - Cache / Task Broker: Render Managed Redis or Upstash Redis
#   - Database: Supabase PostgreSQL (Set DATABASE_URL in Render Dashboard)
#   - Frontend: Vercel Static Web App (https://vercel.com)
#
# SECRET SETUP:
#   Upload your .env as a Secret File in the Render dashboard:
#   → ecovision-backend  : Environment → Secret Files → Filename: /app/.env (or environment variables)
#   → ecovision-celery   : Environment → Secret Files → Filename: /app/.env (or environment variables)
#
# DATABASE_URL: Connect to Supabase Postgres (Session Mode :5432 or Transaction Pooler :6543)
# REDIS_URL: Connect to Render Managed Redis or External Redis (Upstash)
###############################################################################

services:
  # ---------------------------------------------------------------------------
  # 1. Backend — FastAPI / Uvicorn Web Service (Native Python)
  # ---------------------------------------------------------------------------
  - type: web
    name: ecovision-backend
    runtime: python
    buildCommand: bash scripts/render-build.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health

    envVars:
      # ── Auto-injected from linked Render Redis service (if used) ───────────
      - key: REDIS_URL
        fromService:
          name: ecovision-redis
          type: redis
          property: connectionString

      # ── Runtime overrides ──────────────────────────────────────────────────
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: REPORTS_DIR
        value: /tmp/reports
      - key: ALLOWED_ORIGINS
        value: https://ecovision-frontend.vercel.app
      - key: OPENROUTER_MODEL
        value: mistralai/mistral-7b-instruct
      # Set DATABASE_URL in Render Dashboard to your Supabase Connection String:
      # postgresql://postgres:[YOUR-PASSWORD]@db.[YOUR-PROJECT-REF].supabase.co:5432/postgres

  # ---------------------------------------------------------------------------
  # 2. Celery Worker — Async Task Processor (Native Python)
  # ---------------------------------------------------------------------------
  - type: worker
    name: ecovision-celery
    runtime: python
    buildCommand: pip install --no-cache-dir -r backend/requirements.txt
    startCommand: cd backend && celery -A app.core.celery_app worker --loglevel=info
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true

    envVars:
      # ── Auto-injected from linked Render Redis service ─────────────────────
      - key: REDIS_URL
        fromService:
          name: ecovision-redis
          type: redis
          property: connectionString

      # ── Runtime overrides ──────────────────────────────────────────────────
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: REPORTS_DIR
        value: /tmp/reports
      - key: OPENROUTER_MODEL
        value: mistralai/mistral-7b-instruct

  # ---------------------------------------------------------------------------
  # 3. Redis — Cache & Task Broker
  # ---------------------------------------------------------------------------
  - type: redis
    name: ecovision-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru

# NOTE: Frontend is hosted separately on Vercel.
# Connect your repository to Vercel and deploy the frontend directory directly.
