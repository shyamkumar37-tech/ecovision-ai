###############################################################################
# EcoVision AI — Render Blueprint (100% Free Plan)
# Docs: https://render.com/docs/blueprint-spec
#
# HOSTING ARCHITECTURE:
#   - Backend & Celery Worker: Render Web Service (Free Tier - Python 3.11.9)
#   - Cache / Task Broker: Upstash Redis (Free Tier)
#   - Database: Supabase PostgreSQL (Free Tier)
#   - Frontend: Vercel Static Web App (Free Tier)
#
# ENVIRONMENT SETUP IN RENDER DASHBOARD:
#   - DATABASE_URL = postgresql://postgres:[PASSWORD]@db.[REF].supabase.co:5432/postgres
#   - REDIS_URL    = redis://default:[PASSWORD]@[HOST].upstash.io:6379
#   - SECRET_KEY   = [YOUR-64-CHAR-HEX-SECRET]
#   - OPENROUTER_API_KEY = [YOUR-OPENROUTER-KEY]
###############################################################################

services:
  # ---------------------------------------------------------------------------
  # Backend API & Celery Worker — FastAPI (Native Python 3.11 - 100% Free Tier)
  # ---------------------------------------------------------------------------
  - type: web
    name: ecovision-backend
    runtime: python
    buildCommand: bash scripts/render-build.sh
    startCommand: cd backend && bash entrypoint.sh
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: REPORTS_DIR
        value: /tmp/reports
      - key: ALLOWED_ORIGINS
        value: https://ecovision-frontend.vercel.app
      - key: OPENROUTER_MODEL
        value: openrouter/free
