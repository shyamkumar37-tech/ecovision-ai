###############################################################################
# EcoVision AI — Render Blueprint (render.yaml)
# Docs: https://render.com/docs/blueprint-spec
#
# SECRET SETUP:
#   Upload your .env as a Secret File in the Render dashboard:
#   → ecovision-backend  : Secret Files → Filename: /app/.env
#   → ecovision-celery   : Secret Files → Filename: /app/.env
#
# DATABASE_URL and REDIS_URL are auto-injected from the services below
# and will override anything in the .env file automatically.
###############################################################################

databases:
  - name: ecovision-postgres
    databaseName: ecovision
    user: ecovision
    plan: free
    region: oregon

services:
  # ---------------------------------------------------------------------------
  # 1. Backend — FastAPI / Gunicorn web service
  # ---------------------------------------------------------------------------
  - type: web
    name: ecovision-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health

    envVars:
      # ── Auto-injected from linked Render services (override .env file) ─────
      - key: DATABASE_URL
        fromDatabase:
          name: ecovision-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: ecovision-redis
          type: redis
          property: connectionString

      # ── Runtime overrides (not secrets, safe to be here) ───────────────────
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: REPORTS_DIR
        value: /tmp/reports
      - key: ALLOWED_ORIGINS
        value: https://ecovision-frontend.onrender.com
      - key: OPENROUTER_MODEL
        value: mistralai/mistral-7b-instruct

  # ---------------------------------------------------------------------------
  # 2. Celery Worker
  # ---------------------------------------------------------------------------
  - type: worker
    name: ecovision-celery
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.celery
    dockerContext: ./backend
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true

    envVars:
      # ── Auto-injected from linked Render services ──────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: ecovision-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: ecovision-redis
          type: redis
          property: connectionString

      # ── Runtime overrides ──────────────────────────────────────────────────
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: REPORTS_DIR
        value: /tmp/reports
      - key: OPENROUTER_MODEL
        value: mistralai/mistral-7b-instruct

  # ---------------------------------------------------------------------------
  # 3. Redis
  # ---------------------------------------------------------------------------
  - type: redis
    name: ecovision-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru

  # ---------------------------------------------------------------------------
  # 4. Frontend — Vite/React Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: ecovision-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    region: oregon
    branch: main
    autoDeploy: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ecovision-backend.onrender.com
